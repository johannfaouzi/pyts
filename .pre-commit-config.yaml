repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix, --output-format=full]
      - id: ruff-format

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: "1.3.1"
    hooks:
      - id: pyrefly-check
        # pyrefly resolves types by reading each dependency's own source
        # (none of these ship stubs), so its isolated pre-commit venv needs
        # them installed too, or every import from them is unresolved.
        additional_dependencies:
          - numpy>=1.24.0
          - scipy>=1.10.0
          - scikit-learn>=1.6.0
          - numba>=0.60.0
          - joblib>=1.3.0
          - pytest
